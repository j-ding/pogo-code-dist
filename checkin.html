<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="app-version" content="2.12.1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Check-In - North Fulton PKGO Raids</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=2.12.1">
</head>
<body>
  <div class="container redeem-container">
    <header>
      <img src="img/north-fulton-icon.png" class="brand-icon" width="320" height="320" alt="">
      <h1>North Fulton PKGO Raids</h1>
      <p class="subtitle">Event Check-In</p>
    </header>

    <section id="step-loading" class="card">
      <div class="spinner"></div>
    </section>

    <section id="step-unavailable" class="card hidden">
      <h2 id="unavailable-title">Event Not Found</h2>
      <p id="unavailable-message">This check-in link isn't valid. Ask an organizer for a new one.</p>
    </section>

    <section id="step-join" class="card hidden">
      <h2 id="join-title">Check In</h2>
      <p>Enter your Pokemon Go trainer name to check in.</p>
      <form id="checkin-form">
        <div class="form-group">
          <label for="checkin-trainer">Trainer Name</label>
          <input type="text" id="checkin-trainer" placeholder="Your trainer name" pattern="\s*[A-Za-z0-9][A-Za-z0-9\s]*" title="Letters and numbers only" autocapitalize="off" autocomplete="off" spellcheck="false" required>
        </div>
        <div class="form-group checkbox-group remember-name">
          <label><input type="checkbox" id="remember-name"> Remember my trainer name on this device</label>
        </div>
        <div id="alerts-row" class="form-group checkbox-group remember-name hidden">
          <label><input type="checkbox" id="alerts-optin"> Send me alerts during this event, like when the raffle starts</label>
        </div>
        <p id="checkin-error" class="login-error hidden"></p>
        <button type="submit" id="checkin-submit" class="btn btn-primary btn-large">Check In</button>
      </form>
    </section>

    <section id="step-joined" class="card hidden">
      <h2>You're Checked In!</h2>
      <p id="joined-message"></p>
    </section>
  </div>

  <script src="js/site-config.js?v=2.12.1"></script>
  <script src="js/error-logger.js?v=2.12.1"></script>
  <script src="js/trainer-memory.js?v=2.12.1"></script>
  <script src="js/alerts.js?v=2.12.1"></script>
  <script src="js/checkin.js?v=2.12.1"></script>
</body>
</html>
